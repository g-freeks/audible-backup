# Sandboxed setup: all data lives in named Docker volumes — the container has
# no access to the host filesystem. Get your converted books out through the
# web UI's Download buttons.
services:
  audible-backup:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - aax:/data/aax
      - converted:/data/converted
      - db:/data/db
      - audible-auth:/root/.audible
    environment:
      - AUDIBLE_ACTIVATION_BYTES=${AUDIBLE_ACTIVATION_BYTES}
      - AUDIBLE_TARGET_DIR=/data/aax
      - AUDIBLE_OUTPUT_DIR=/data/converted
      - DB_PATH=/data/db/audiobooks.db
      - MP3_QUALITY=${MP3_QUALITY:-4}
      - WEB_PORT=3000
      # Optional basic auth for the web UI; strongly recommended.
      - WEB_USER=${WEB_USER:-}
      - WEB_PASSWORD=${WEB_PASSWORD:-}
    restart: unless-stopped

volumes:
  aax:
  converted:
  db:
  audible-auth:
