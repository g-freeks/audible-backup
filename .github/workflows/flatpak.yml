name: flatpak

# Building a Flatpak means pulling a GNOME runtime and SDK — over a gigabyte —
# so this deliberately does not gate every push. It runs when something that
# can actually affect the bundle changes, on main, on release tags, and on
# demand. (GitHub Actions does not support YAML anchors, hence the repeated
# path list.)
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'flatpak/**'
      - 'desktop/**'
      - 'src/**'
      - 'helper/**'
      - 'server.ts'
      - 'app.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/flatpak.yml'
  pull_request:
    paths:
      - 'flatpak/**'
      - 'desktop/**'
      - 'src/**'
      - 'helper/**'
      - 'server.ts'
      - 'app.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/flatpak.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # only used to attach a bundle to a release, on tags
    steps:
      - uses: actions/checkout@v7

      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user \
            flathub https://flathub.org/repo/flathub.flatpakrepo

      # The runtime download dominates this job, and the build cache also lets
      # unchanged dependency modules be reused between runs.
      - name: Cache flatpak-builder state
        uses: actions/cache@v6
        with:
          path: .flatpak-builder
          key: flatpak-builder-${{ hashFiles('flatpak/*.yml', 'flatpak/*.json') }}
          restore-keys: flatpak-builder-

      # --install-deps-from resolves the runtime, the SDK and the node
      # extension at the branches the manifest actually needs, rather than
      # guessing them here.
      - name: Build
        run: |
          flatpak-builder --user --install-deps-from=flathub \
            --repo=repo --install --force-clean \
            build flatpak/io.github.g_freeks.audible_backup.yml

      # Everything phase 3 had to assume about the sandbox is checked here.
      - name: Smoke test
        run: flatpak/smoke-test.sh

      - name: Validate the store metadata
        run: |
          sudo apt-get install -y appstream desktop-file-utils
          appstreamcli validate --no-net --explain \
            desktop/io.github.g_freeks.audible_backup.metainfo.xml
          desktop-file-validate desktop/io.github.g_freeks.audible_backup.desktop

      # aarch64 would need QEMU emulation and takes hours; x86_64 only for now.
      - name: Build bundle
        run: |
          flatpak build-bundle repo audible-backup-x86_64.flatpak \
            io.github.g_freeks.audible_backup
          ls -lh audible-backup-x86_64.flatpak

      - uses: actions/upload-artifact@v7
        with:
          name: audible-backup-flatpak-x86_64
          path: audible-backup-x86_64.flatpak

      - name: Attach bundle to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" audible-backup-x86_64.flatpak --clobber
