# Flatpak manifest for Audible Backup.
#
# Build it with:
#   flatpak-builder --user --install --force-clean build flatpak/io.github.g_freeks.audible_backup.yml
#
# The two dependency modules are generated, never hand-edited:
#   python3 scripts/generate-flatpak-sources.py
#
# See ../docs/flatpak-plan.md for why the pieces are arranged this way.

id: io.github.g_freeks.audible_backup

# GNOME rather than freedesktop: the shell needs GTK 4, WebKitGTK 6.0 and gjs,
# and only the GNOME runtime ships all three. It also inherits everything the
# freedesktop platform provides, which is where ffmpeg and python3 come from.
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk

# Node is not in any runtime; the SDK extension supplies it at build time and
# the binary is copied into /app so it is there at run time too.
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node24

command: audible-backup

finish-args:
  # Audible's API, and the loopback server the window talks to.
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # WebKit renders through the GPU where it can.
  - --device=dri
  # Converted audiobooks belong to the user, not the sandbox.
  - --filesystem=xdg-music:create
  # Vendored Python packages live outside the interpreter's default paths so
  # that nothing here depends on the runtime's Python minor version.
  - --env=PYTHONPATH=/app/lib/audible-python

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - '*.a'
  - '*.la'

modules:
  # Both generated by scripts/generate-flatpak-sources.py.
  - python3-audible.json
  - node-modules.json

  - name: audible-backup
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node24/bin
    build-commands:
      # Node 24 runs the TypeScript sources directly by stripping types, so
      # there is nothing to compile and no build output to install.
      - install -Dm755 /usr/lib/sdk/node24/bin/node /app/bin/node

      - install -d /app/share/audible-backup
      - cp -r server.ts app.ts package.json src helper /app/share/audible-backup/

      # The shell looks for /app/bin/node and
      # /app/share/audible-backup/server.ts, both of which now exist.
      - install -Dm755 desktop/audible-backup /app/bin/audible-backup

      - install -Dm644 desktop/io.github.g_freeks.audible_backup.desktop
        /app/share/applications/io.github.g_freeks.audible_backup.desktop
      - install -Dm644 desktop/io.github.g_freeks.audible_backup.metainfo.xml
        /app/share/metainfo/io.github.g_freeks.audible_backup.metainfo.xml

      - install -Dm644 desktop/icons/scalable/io.github.g_freeks.audible_backup.svg
        /app/share/icons/hicolor/scalable/apps/io.github.g_freeks.audible_backup.svg
      - install -Dm644 desktop/icons/128x128/io.github.g_freeks.audible_backup.png
        /app/share/icons/hicolor/128x128/apps/io.github.g_freeks.audible_backup.png
      - install -Dm644 desktop/icons/256x256/io.github.g_freeks.audible_backup.png
        /app/share/icons/hicolor/256x256/apps/io.github.g_freeks.audible_backup.png

    sources:
      - type: dir
        path: ..
        skip:
          # Installed by the generated node-modules module instead, from
          # pinned tarballs rather than whatever is in the working tree.
          - node_modules
          - .git
          - test
          - scripts
          - flatpak
          - data
